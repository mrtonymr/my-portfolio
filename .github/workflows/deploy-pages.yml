name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install portfolio dependencies
        run: npm ci

      - name: Install Developer Toolbox dependencies
        run: npm ci
        working-directory: developer-toolbox

      - name: Install Interview Prep Hub dependencies
        run: npm ci
        working-directory: interview-prep-hub

      - name: Build portfolio
        run: npm run build:gh-pages

      - name: Build Developer Toolbox
        run: npm run build
        working-directory: developer-toolbox

      - name: Build Interview Prep Hub
        run: npm run build
        working-directory: interview-prep-hub

      - name: Bundle playground apps into Pages artifact
        run: |
          mkdir -p dist/cursor-test/browser/developer-toolbox
          mkdir -p dist/cursor-test/browser/interview-prep-hub
          cp -R developer-toolbox/dist/developer-toolbox/browser/. dist/cursor-test/browser/developer-toolbox/
          cp -R interview-prep-hub/dist/interview-prep-hub/browser/. dist/cursor-test/browser/interview-prep-hub/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/cursor-test/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

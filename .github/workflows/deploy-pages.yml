name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build:gh-pages

      - name: Upload portfolio artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio
          path: dist/cursor-test/browser
          retention-days: 1

  build-developer-toolbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: developer-toolbox/package-lock.json

      - name: Install and build
        working-directory: developer-toolbox
        run: |
          npm ci
          npm run build

      - name: Upload Developer Toolbox artifact
        uses: actions/upload-artifact@v4
        with:
          name: developer-toolbox
          path: developer-toolbox/dist/developer-toolbox/browser
          retention-days: 1

  build-interview-prep-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: interview-prep-hub/package-lock.json

      - name: Install and build
        working-directory: interview-prep-hub
        run: |
          npm ci
          npm run build

      - name: Upload Interview Prep Hub artifact
        uses: actions/upload-artifact@v4
        with:
          name: interview-prep-hub
          path: interview-prep-hub/dist/interview-prep-hub/browser
          retention-days: 1

  package-pages:
    needs:
      - build-portfolio
      - build-developer-toolbox
      - build-interview-prep-hub
    runs-on: ubuntu-latest
    steps:
      - name: Download portfolio
        uses: actions/download-artifact@v4
        with:
          name: portfolio
          path: site

      - name: Download Developer Toolbox
        uses: actions/download-artifact@v4
        with:
          name: developer-toolbox
          path: site/developer-toolbox

      - name: Download Interview Prep Hub
        uses: actions/download-artifact@v4
        with:
          name: interview-prep-hub
          path: site/interview-prep-hub

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: package-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

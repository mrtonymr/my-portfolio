<section class="page fade-in">
  <header class="page-header">
    <div>
      <h1 class="page-title">Statistics</h1>
      <p class="page-subtitle">Completion, streaks, and category breakdowns.</p>
    </div>
  </header>

  <div class="stats-grid">
    <article class="stat glass">
      <mat-icon>percent</mat-icon>
      <div>
        <span>Completion</span>
        <strong>{{ completion() }}%</strong>
        <small>{{ completedCount() }} / {{ total() }}</small>
      </div>
    </article>
    <article class="stat glass">
      <mat-icon>bookmark</mat-icon>
      <div>
        <span>Bookmarks</span>
        <strong>{{ bookmarks() }}</strong>
      </div>
    </article>
    <article class="stat glass">
      <mat-icon>local_fire_department</mat-icon>
      <div>
        <span>Streak</span>
        <strong>{{ streak() }}</strong>
      </div>
    </article>
  </div>

  <div class="charts">
    <article class="panel glass">
      <h2>Category completion</h2>
      <app-chart type="bar" [config]="categoryBar()" />
    </article>
    <article class="panel glass">
      <h2>Completed by difficulty</h2>
      <app-chart type="pie" [config]="difficultyPie()" />
    </article>
    <article class="panel glass">
      <h2>Weekly activity</h2>
      <app-chart type="line" [config]="weeklyLine()" />
    </article>
    <article class="panel glass">
      <h2>Category radar</h2>
      <app-chart type="radar" [config]="categoryRadar()" />
    </article>
  </div>
</section>
